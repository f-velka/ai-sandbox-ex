# agent-sandbox 許可ドメインリスト
#
# このファイルが外向き通信のポリシーの唯一の原本である。ホスト上で直接編集し、
# gatewayの再起動(docker compose -f .devcontainer/docker-compose.yml restart gateway)で反映する。
#
# 書式(gateway/sni_proxy.pyが実装し、testsが固定する):
#   - 1行1エントリ。前後の空白は無視する。
#   - `#`で始まる行はコメント(行全体のみ。行末コメントは非対応)。
#   - 空行は無視する。
#   - 完全一致ホスト名(例: github.com。サブドメインには一致しない)、または
#     `*.`接頭辞のワイルドカード(例: *.github.com。任意の深さのサブドメインに一致し、
#     ベースドメイン自身には一致しない)。

# Claude Code / Anthropic API
api.anthropic.com
# 初回認証に必要
platform.claude.com

# Codex / OpenAI API
api.openai.com
# 初回認証(device auth含む)に必要
auth.openai.com
# ChatGPTアカウント利用時のbackend API/WebSocket
chatgpt.com
# ab.chatgpt.com(メトリクス経路)はタスク実行に不要のため許可しない。

# ソースコード取得・パッケージ配布(git clone, npm/pip等の一部がGitHub Releases経由)
github.com
*.github.com
*.githubusercontent.com

# Docker Hubからのイメージ取得
registry-1.docker.io
auth.docker.io
production.cloudfront.docker.com
production.cloudflare.docker.com

# 主要言語のパッケージレジストリ
# npm
registry.npmjs.org
# Python (pip / uv)
pypi.org
files.pythonhosted.org
# Rust (cargo)
crates.io
index.crates.io
static.crates.io
# Go (module proxyとchecksum database)
proxy.golang.org
sum.golang.org
